<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assignments · Mr. Young</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261123"></head><body data-nav-page="assignments">
<nav><a class="logo" href="index.html"><div class="mark">ELA</div>7th Grade ELA/R</a>
<ul><li><a href="index.html" data-nav="home">Home</a></li><li><a href="meet.html" data-nav="meet">Meet Mr. Young</a></li><li class="on"><a href="assignments.html" data-nav="assignments">Assignments</a></li><li><a href="news.html" data-nav="news">Weekly News</a></li><li data-nav="coming">Coming Up</li><li data-nav="families">Families</li></ul></nav>
<main class="page">
<div class="eyebrow">7th Grade ELA/R</div>
<h1 data-nav-heading="assignments">Assignments</h1>
<p class="sub">What we're working on each nine weeks. Click any assignment to see the blank copy and what it's about.</p>
<div class="qtabs" id="qtabs"></div>
<div id="overview"></div>
<div class="legend" id="legend"></div>
<div id="list"><div class="empty">Loading assignments…</div></div>
<div id="modal"></div>
</main>
<footer><span>7th Grade ELA/R</span><a class="manage" href="manage.html">Manage</a></footer>
<script type="module">
import {loadAssignments,loadSettings,loadNav,applyNav,rowHTML,detailHTML,TYPES,QUARTERS,esc} from "./fb.js?v=20261123";
let all=[], set={}, q=1, filter="All";
try{ [all,set,nav]=await Promise.all([loadAssignments(),loadSettings(),loadNav()]); applyNav(nav); }catch(e){ console.warn(e); }
q=Number(new URLSearchParams(location.search).get("q"))||Number(set.currentQuarter)||1;
const $=id=>document.getElementById(id);
function draw(){
  $("qtabs").innerHTML=QUARTERS.map((n,i)=>`<button class="qtab ${i+1===q?"on":""}" data-q="${i+1}">${n}</button>`).join("");
  const ov=set["q"+q];
  $("overview").innerHTML=ov?`<div class="overview"><b>This nine weeks</b>${esc(ov)}</div>`:"";
  $("legend").innerHTML=["All",...TYPES].map(t=>`<button class="f ${t===filter?"on":""}" data-t="${t}">${t==="All"?"":`<i style="background:var(--c-${t})"></i>`}${t}</button>`).join("");
  const list=all.filter(a=>(Number(a.quarter)||1)===q && (filter==="All"||a.type===filter));
  $("list").innerHTML=list.length?`<table class="atable"><thead><tr><th>Name</th><th>Type</th><th>Due date</th><th>Points</th></tr></thead><tbody>${list.map(rowHTML).join("")}</tbody></table>`:'<div class="empty">Nothing posted for this nine weeks yet.</div>';
}
document.addEventListener("click",e=>{
  const qt=e.target.closest("[data-q]"); if(qt){ q=Number(qt.dataset.q); draw(); return; }
  const ft=e.target.closest("[data-t]"); if(ft){ filter=ft.dataset.t; draw(); return; }
  const tl=e.target.closest("tr.r"); if(tl){ const a=all.find(x=>x.id===tl.dataset.id); $("modal").innerHTML=detailHTML(a); document.body.style.overflow="hidden"; return; }
  if(e.target.id==="mbg"||e.target.id==="mx"){ $("modal").innerHTML=""; document.body.style.overflow=""; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ $("modal").innerHTML=""; document.body.style.overflow=""; }});
draw();
</script>
</body></html>
